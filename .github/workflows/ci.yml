name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: healthcare_ai_app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d healthcare_ai_app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthcare_ai_app
      AUTH_SECRET: ci_test_secret
      NEXTAUTH_URL: http://localhost:3000
      REDIS_ENABLED: "true"
      REDIS_URL: redis://localhost:6379
      ALLOWED_ORIGINS: http://localhost:3000
      LOG_LEVEL: info

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm run test
      - run: npm run build
